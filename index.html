        { q: "Trong IaaS, người dùng chịu trách nhiệm:", a_text: "Hệ điều hành và ứng dụng", ops: ["Hạ tầng vật lý", "Hệ điều hành và ứng dụng", "Không gì", "Chỉ mạng"] },
        { q: "SaaS có hạn chế là:", a_text: "Ít tùy chỉnh", ops: ["Không dùng Internet", "Ít tùy chỉnh", "Không có phần mềm", "Không có user"] },
        { q: "Trong mô hình cloud, mức độ kiểm soát giảm dần theo thứ tự:", a_text: "IaaS → PaaS → SaaS", ops: ["SaaS → PaaS → IaaS", "IaaS → PaaS → SaaS", "PaaS → SaaS → IaaS", "Không xác định"] }
    ]
};

let correctCount = 0;
let wrongCount = 0;
let currentList = [];

// Hàm trộn mảng
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function startQuiz(mode) {
    let allQuestions = [];
    
    if (mode === 'all') {
        // Gom tất cả câu hỏi từ các chương
        Object.values(rawData).forEach(chapter => {
            allQuestions = allQuestions.concat(chapter);
        });
        // Lấy ngẫu nhiên 40 câu
        currentList = shuffle(allQuestions).slice(0, 40);
        document.getElementById('status').innerText = "Chế độ: TỔNG HỢP (40 câu)";
    } else {
        currentList = shuffle([...rawData[mode]]);
        document.getElementById('status').innerText = `Chương ${mode} | Đúng: 0 | Sai: 0`;
    }
    
    document.getElementById('menu-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    
    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    correctCount = 0;
    wrongCount = 0;

    currentList.forEach((item, qIdx) => {
        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.id = `qbox-${qIdx}`;
        qBox.innerHTML = `<p><strong>Câu ${qIdx + 1}:</strong> ${item.q}</p>`;

        // Trộn các đáp án
        const shuffledOps = shuffle([...item.ops]);
        
        const optsList = document.createElement('div');
        shuffledOps.forEach((optText, optIdx) => {
            const optItem = document.createElement('div');
            optItem.className = 'option-item';
            optItem.innerText = optText;
            
            // Khi bấm, so sánh text nội dung với đáp án đúng (item.a_text)
            optItem.onclick = () => checkAnswer(qIdx, optItem, optText, item.a_text);
            optsList.appendChild(optItem);
        });

        qBox.appendChild(optsList);
        container.appendChild(qBox);
    });
}

function checkAnswer(qIdx, element, selectedText, correctText) {
    const qBox = document.getElementById(`qbox-${qIdx}`);
    const options = qBox.querySelectorAll('.option-item');
    
    // Khóa câu hỏi này
    options.forEach(opt => opt.classList.add('disabled'));

    if (selectedText === correctText) {
        element.classList.add('correct');
        correctCount++;
    } else {
        element.classList.add('wrong');
        // Tìm và highlight đáp án đúng
        options.forEach(opt => {
            if (opt.innerText === correctText) opt.classList.add('correct');
        });
        wrongCount++;
    }
    
    document.getElementById('status').innerText = `Đúng: ${correctCount} | Sai: ${wrongCount}`;
}
</script>
