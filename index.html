<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Cloud - Full 150 Câu</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --success: #059669; --error: #dc2626; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .menu-screen, .quiz-screen { display: none; }
        .active { display: block; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; text-align: center; }
        .btn-menu { background: var(--primary); color: white; text-align: left; }
        .btn-random { background: #7c3aed; color: white; text-align: left; }
        .btn-full { background: #db2777; color: white; text-align: left; border: 2px solid #9d174d; }
        .btn-reset { background: #64748b; color: white; margin-top: 30px; }
        .question-box { margin-bottom: 25px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; }
        .option-item { margin: 10px 0; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .option-item.correct { background: #d1fae5 !important; border-color: var(--success) !important; color: #065f46; font-weight: bold; }
        .option-item.wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #991b1b; }
        .disabled { pointer-events: none; }
        .progress-bar { position: sticky; top: 0; background: white; padding: 10px 0; border-bottom: 2px solid var(--primary); margin-bottom: 20px; z-index: 10; font-weight: bold; color: var(--primary); text-align: center;}
    </style>
</head>
<body>

<div class="container">
    <h1>THI TRẮC NGHIỆM CLOUD</h1>

    <div id="menu-screen" class="menu-screen active">
        <p style="text-align: center;">Chọn chế độ ôn tập (Trộn câu hỏi & đáp án):</p>
        <button class="btn btn-menu" onclick="startQuiz(1)">Chương 1: Tổng quan Cloud Computing</button>
        <button class="btn btn-menu" onclick="startQuiz(2)">Chương 2: Đặc tính & Công nghệ nền tảng</button>
        <button class="btn btn-menu" onclick="startQuiz(3)">Chương 3: Lưu trữ và Xử lý dữ liệu</button>
        <button class="btn btn-menu" onclick="startQuiz(4)">Chương 4: An toàn và Bảo mật</button>
        <button class="btn btn-menu" onclick="startQuiz(5)">Chương 5: Sử dụng dịch vụ Cloud</button>
        <button class="btn btn-random" onclick="startQuiz('random40')">⭐ ĐỀ TỔNG HỢP (40 câu ngẫu nhiên)</button>
        <button class="btn btn-full" onclick="startQuiz('full')">🔥 ÔN TẬP TOÀN BỘ (150 CÂU)</button>
    </div>

    <div id="quiz-screen" class="quiz-screen">
        <div class="progress-bar" id="status">Đúng: 0 | Sai: 0</div>
        <div id="questions-container"></div>
        <button class="btn btn-reset" onclick="location.reload()">← QUAY LẠI MENU</button>
    </div>
</div>

<script>
// Dữ liệu thô (Bạn có thể bổ sung thêm đủ 150 câu vào các mảng này)
const rawData = {
    1: [
        { q: "Điện toán đám mây (cloud computing) là:", a_text: "Mô hình cung cấp tài nguyên qua Internet", ops: ["Hệ thống máy tính cá nhân", "Mô hình cung cấp tài nguyên qua Internet", "Phần mềm offline", "Hệ điều hành"] },
        { q: "Cloud computing bắt nguồn từ ý tưởng:", a_text: "Time-sharing", ops: ["AI", "Time-sharing", "Blockchain", "IoT"] },
        { q: "AWS được Amazon cung cấp vào năm:", a_text: "2006", ops: ["2000", "2003", "2006", "2010"] },
        { q: "Một đặc tính của cloud theo NIST là:", a_text: "On-demand self-service", ops: ["Không mạng", "On-demand self-service", "Không user", "Không dữ liệu"] },
        { q: "Measured service nghĩa là:", a_text: "Tính phí theo sử dụng", ops: ["Không đo lường", "Tính phí theo sử dụng", "Không có chi phí", "Không có dữ liệu"] }
        // ... (Tiếp tục thêm cho đủ 30 câu chương 1)
    ],
    2: [
        { q: "Công nghệ quan trọng nhất trong cloud là:", a_text: "Ảo hóa", ops: ["AI", "IoT", "Ảo hóa", "Blockchain"] },
        { q: "Hypervisor dùng để:", a_text: "Tạo máy ảo", ops: ["Lưu trữ dữ liệu", "Tạo máy ảo", "Mã hóa dữ liệu", "Tăng tốc CPU"] }
        // ... (Tiếp tục thêm cho đủ 30 câu chương 2)
    ],
    3: [
        { q: "HDFS thuộc framework nào?", a_text: "Hadoop", ops: ["Spark", "Hadoop", "AWS", "Azure"] },
        { q: "MapReduce gồm hai bước chính:", a_text: "Map & Reduce", ops: ["Read & Write", "Map & Reduce", "Load & Save", "Input & Output"] }
        // ... (Tiếp tục thêm cho đủ 30 câu chương 3)
    ],
    4: [
        { q: "Authentication dùng để:", a_text: "Xác thực người dùng", ops: ["Mã hóa", "Xác thực người dùng", "Lưu trữ", "Xóa dữ liệu"] },
        { q: "Integrity nghĩa là:", a_text: "Toàn vẹn dữ liệu", ops: ["Bảo mật dữ liệu", "Toàn vẹn dữ liệu", "Sẵn sàng", "Truy cập"] }
        // ... (Tiếp tục thêm cho đủ 30 câu chương 4)
    ],
    5: [
        { q: "SaaS cung cấp cho người dùng:", a_text: "Phần mềm hoàn chỉnh", ops: ["Phần cứng", "Phần mềm hoàn chỉnh", "CPU", "RAM"] },
        { q: "IaaS cung cấp:", a_text: "Hạ tầng như máy chủ, lưu trữ", ops: ["Ứng dụng hoàn chỉnh", "Hạ tầng như máy chủ, lưu trữ", "Chỉ database", "Chỉ web"] }
        // ... (Tiếp tục thêm cho đủ 30 câu chương 5)
    ]
};

let correctCount = 0;
let wrongCount = 0;
let currentList = [];

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function startQuiz(mode) {
    let allQuestions = [];
    Object.values(rawData).forEach(chapter => {
        allQuestions = allQuestions.concat(chapter);
    });

    if (mode === 'random40') {
        currentList = shuffle(allQuestions).slice(0, 40);
        document.getElementById('status').innerText = "Chế độ: TỔNG HỢP (40 câu)";
    } else if (mode === 'full') {
        currentList = shuffle(allQuestions); // Trộn toàn bộ 150 câu
        document.getElementById('status').innerText = `Chế độ: TOÀN BỘ (${currentList.length} câu)`;
    } else {
        currentList = shuffle([...rawData[mode]]);
        document.getElementById('status').innerText = `Chương ${mode} | Đúng: 0 | Sai: 0`;
    }
    
    document.getElementById('menu-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    
    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    correctCount = 0;
    wrongCount = 0;

    currentList.forEach((item, qIdx) => {
        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerHTML = `<p><strong>Câu ${qIdx + 1}:</strong> ${item.q}</p>`;

        const shuffledOps = shuffle([...item.ops]);
        const optsList = document.createElement('div');
        
        shuffledOps.forEach((optText) => {
            const optItem = document.createElement('div');
            optItem.className = 'option-item';
            optItem.innerText = optText;
            optItem.onclick = () => {
                const options = optsList.querySelectorAll('.option-item');
                options.forEach(o => o.classList.add('disabled'));
                
                if (optText === item.a_text) {
                    optItem.classList.add('correct');
                    correctCount++;
                } else {
                    optItem.classList.add('wrong');
                    options.forEach(o => {
                        if (o.innerText === item.a_text) o.classList.add('correct');
                    });
                    wrongCount++;
                }
                updateProgressBar();
            };
            optsList.appendChild(optItem);
        });

        qBox.appendChild(optsList);
        container.appendChild(qBox);
    });
}

function updateProgressBar() {
    const totalSelected = correctCount + wrongCount;
    document.getElementById('status').innerText = `Tiến độ: ${totalSelected}/${currentList.length} | Đúng: ${correctCount} | Sai: ${wrongCount}`;
}
</script>

</body>
</html>
