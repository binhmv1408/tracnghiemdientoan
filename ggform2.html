    <style>
        :root { --primary: #1a73e8; --bg: #f0f2f5; --text: #202124; --success: #1e8e3e; --error: #d93025; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }

        .question-text { font-weight: 600; margin-bottom: 12px; font-size: 16px; color: #3c4043; }
        .option { display: block; padding: 10px 15px; margin: 6px 0; border: 1px solid #dadce0; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 15px; }

        .option.wrong { background: #fce8e6 !important; border-color: var(--error) !important; color: #a50e0e !important; }
        .disabled { pointer-events: none; }
        .status-bar { position: sticky; top: 0; background: white; padding: 12px; border-bottom: 3px solid var(--primary); margin-bottom: 20px; z-index: 100; text-align: center; font-weight: bold; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-back { display: block; width: fit-content; margin: 20px auto; padding: 10px 25px; text-align: center; background: #5f6368; color: white; text-decoration: none; border-radius: 4px; font-weight: 600; }

let correctCount = 0;
let wrongCount = 0;

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function renderQuiz() {
    const container = document.getElementById('quiz-container');
    
    questions.forEach((item, index) => {
        const box = document.createElement('div');
        box.className = 'question-box';
        box.innerHTML = `<div class="question-text">Câu ${index + 1}: ${item.q}</div>`;

        const optsDiv = document.createElement('div');
        // Trộn các phương án trả lời để không bị học vẹt vị trí
        shuffle([...item.ops]).forEach(optText => {
            const optBtn = document.createElement('div');
            optBtn.className = 'option';
            optBtn.innerText = optText;
            
            optBtn.onclick = () => {
                const siblings = optsDiv.querySelectorAll('.option');
                if (siblings[0].classList.contains('disabled')) return;
                
                siblings.forEach(s => s.classList.add('disabled'));
                
                if (optText === item.a) {
                    optBtn.classList.add('correct');
                    correctCount++;
                } else {
                    optBtn.classList.add('wrong');
                    siblings.forEach(s => {
                        if (s.innerText === item.a) s.classList.add('correct');
                    });
                    wrongCount++;
                }
                updateStatus();
            };
            optsDiv.appendChild(optBtn);
        });

        box.appendChild(optsDiv);
        container.appendChild(box);
    });
}

function updateStatus() {
    const total = correctCount + wrongCount;
    document.getElementById('status').innerText = `Tiến độ: ${total}/20 | Đúng: ${correctCount} | Sai: ${wrongCount}`;
}

// Bắt đầu hiển thị câu hỏi
renderQuiz();
</script>
