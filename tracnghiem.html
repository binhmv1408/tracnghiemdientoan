let currentQuestions = [];
let userAnswers = {};

function startQuiz(chapterId) {
    // Trộn câu hỏi
    currentQuestions = [...rawData[chapterId]].sort(() => Math.random() - 0.5);
    userAnswers = {};
    
    document.getElementById('menu-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    document.getElementById('quiz-title').innerText = `Đang làm: Chương ${chapterId} (30 câu)`;
    
    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';
    
    currentQuestions.forEach((item, index) => {
        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerHTML = `<p><strong>Câu ${index + 1}:</strong> ${item.q}</p>`;
        
        const optsList = document.createElement('div');
        optsList.className = 'options-list';
        
        item.ops.forEach((opt, optIdx) => {
            const char = String.fromCharCode(65 + optIdx);
            const optItem = document.createElement('div');
            optItem.className = 'option-item';
            optItem.id = `q${index}-opt${char}`;
            optItem.innerText = `${char}. ${opt}`;
            optItem.onclick = () => selectOption(index, char);
            optsList.appendChild(optItem);
        });
        
        qBox.appendChild(optsList);
        container.appendChild(qBox);
    });
}

function selectOption(qIdx, char) {
    // Xóa class selected cũ
    ['A','B','C','D'].forEach(c => {
        const el = document.getElementById(`q${qIdx}-opt${c}`);
        if(el) el.classList.remove('selected');
    });
    
    // Thêm class mới
    document.getElementById(`q${qIdx}-opt${char}`).classList.add('selected');
    userAnswers[qIdx] = char;
}

function showResults() {
    let score = 0;
    currentQuestions.forEach((item, index) => {
        if(userAnswers[index] === item.a) score++;
    });
    
    document.getElementById('quiz-screen').classList.remove('active');
    document.getElementById('result-screen').classList.add('active');
    
    const finalScore = document.getElementById('final-score');
    finalScore.innerText = `${score}/30`;
    
    let comment = "";
    if(score === 30) comment = "Xuất sắc! Bạn đã nắm vững kiến thức chương này.";
    else if(score >= 24) comment = "Rất tốt! Cố gắng phát huy nhé.";
    else if(score >= 15) comment = "Đạt yêu cầu. Bạn nên xem lại các câu sai.";
    else comment = "Bạn cần ôn tập kỹ hơn nội dung chương này.";
    
    document.getElementById('score-comment').innerText = comment;
    window.scrollTo(0,0);
}
